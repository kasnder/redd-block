# Re-submit an existing App Store .ipa to App Store Connect without rebuilding.
# iOS counterpart of "Microsoft store submission" (store-submit.yml).
#
# Use after a Release already published the .ipa asset (or to retry a failed
# Publish (App Store) job with fixed submit scripts on main).
#
# Actions → "App Store submission" → Run workflow → set release_tag (e.g. v3.8.5).
#
# Retry modes:
#   - Default: downloads the Release .ipa and uploads it again. Fails if App
#     Store Connect already ingested a binary with the same version + build
#     number — in that case use skip_binary_upload instead.
#   - skip_binary_upload: no upload; attaches the already-processed build to
#     the version, stamps What's new, and submits for review. Optionally pin
#     the build with build_number (defaults to the latest build).

name: App Store submission

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag whose .ipa asset to submit (e.g. v3.8.5)
        required: true
        type: string
      skip_binary_upload:
        description: Skip IPA upload and submit a build already in App Store Connect
        type: boolean
        default: false
      build_number:
        description: Build number of the already-uploaded build (blank = latest)
        type: string
        default: ''

concurrency:
  group: app-store-submit-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit-app-store:
    name: Submit to App Store Connect
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require App Store Connect secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=()
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing GitHub secrets for App Store submit: ${missing[*]}. See docs/app-store-ci.md." >&2
            exit 1
          fi

      - name: Download IPA from GitHub Release
        if: ${{ !inputs.skip_binary_upload }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p store-packages-ios
          gh release download "$RELEASE_TAG" \
            --pattern '*.ipa' \
            --dir store-packages-ios \
            --clobber
          echo "Downloaded:"
          find store-packages-ios -type f -name '*.ipa' -print
          count="$(find store-packages-ios -type f -name '*.ipa' | wc -l | tr -d ' ')"
          if [[ "$count" -lt 1 ]]; then
            echo "No .ipa assets on release $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Resolve version
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "$PKG" ]]; then
            echo "Warning: release tag version ($TAG) != package.json ($PKG); using tag for What's new." >&2
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build What's new from changelog (iOS)
        run: |
          node scripts/changelog-to-store-whats-new.js "${{ steps.meta.outputs.version }}" --platform ios --out whats_new_ios.txt
          echo "=== What's new (iOS) ==="
          cat whats_new_ios.txt

      - name: Submit to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          IPA=""
          if [[ "${{ inputs.skip_binary_upload }}" != "true" ]]; then
            IPA="$(find store-packages-ios -type f -name '*.ipa' | head -1)"
            if [[ -z "$IPA" ]]; then
              echo "No .ipa found in store-packages-ios" >&2
              exit 1
            fi
          fi
          fastlane ios submit_app_store \
            "version:${{ steps.meta.outputs.version }}" \
            "ipa:${IPA}" \
            "notes:whats_new_ios.txt" \
            "build_number:${{ inputs.build_number }}"
