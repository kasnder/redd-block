# PR checks: lint, build the frontend bundle, and run the Tier 1 logic suite
# headlessly. The Android debug build lives in android-ci.yml and the Rust unit
# tests in rust-ci.yml, so frontend-only PRs do not pay for those toolchains.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Formatting and static analysis. Deliberately unfiltered by path and on the
  # cheapest runner: rustfmt needs no compilation and no system libraries, so
  # the whole job is dominated by checkout and toolchain setup.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # `--all` from src-tauri also covers tauri-plugin-screentime (a path
      # dependency); tauri-plugin-android-blocker is a separate crate graph and
      # needs its own invocation. Neither compiles anything.
      - name: cargo fmt --check (src-tauri, tauri-plugin-screentime)
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: cargo fmt --check (tauri-plugin-android-blocker)
        working-directory: tauri-plugin-android-blocker
        run: cargo fmt --all --check

  frontend:
    name: Frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Compiles the whole src/ ES-module graph and the index.html entry.
      # Fails on syntax errors, duplicate declarations, unresolved imports.
      - run: npm run vite:build
      # Exercises the Android-only Vite transforms without requiring the
      # native Android/Gradle toolchain.
      - run: npm run vite:build:android
      - run: npm run verify:android-bundle

  tier1:
    name: Tier 1 logic tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Boots the Vite dev server, runs runBlockingTests() in headless
      # Chromium, fails on any failed assertion or a mid-suite crash.
      - run: npm run test:tier1
