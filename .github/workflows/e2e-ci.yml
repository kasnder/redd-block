# Tier 2 end-to-end run: builds the app with the test runners kept in the
# bundle, then drives runIntegrationTests() through a WebDriver session
# attached to the real app's webview. Unlike Tier 1 this exercises the actual
# Tauri command layer.
#
# Windows first: Tauri's WebDriver CI guide documents the Linux and Windows
# `tauri-driver` path, and only Windows is viable here (the app does not build
# on Linux). macOS needs the newer embedded-server provider and an app-side
# plugin, and is not wired up yet.
#
# Tier 2 mutates real state — it writes the data file and drives the block
# pipeline. That is exactly why it stays manual locally and belongs on a
# disposable runner VM. Its domains are all `.invalid` by construction.
name: E2E CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/integration-tests.js'
      - 'src/test-utils.js'
      - 'e2e/**'
      - 'vite.config.js'
      - '.github/workflows/e2e-ci.yml'

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tier2:
    name: Tier 2 (Windows, WebDriver)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Drives the platform's webview via msedgedriver, which is preinstalled
      # on windows-latest images.
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      # --config swaps beforeBuildCommand to the e2e Vite mode so the built
      # binary embeds a bundle that still contains the test runners.
      - name: Build app under test
        run: npm run build:e2e-app
      - name: Run Tier 2
        run: npm run test:tier2
      - name: Upload WDIO logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tier2-wdio-logs
          path: logs/
          if-no-files-found: ignore
