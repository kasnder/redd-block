# Build signed macOS + Windows installers, then publish from the same artifacts.
#
# One workflow run builds once; the publish job uploads those exact files to
# S3 and/or attaches them to a GitHub Release (optional checkboxes on manual runs).
#
# S3 layout matches redd-next download links (ReDDBlockClient.tsx):
#   s3://redd-website-assets/reddblock/reddblock-{version}.pkg
#   s3://redd-website-assets/reddblock/redd-block_{version}_x64-setup.exe
#   s3://redd-website-assets/reddblock/redd-block_{version}_arm64-setup.exe
#
# Trigger: Actions → "Release build" → Run workflow, or push tag v* (e.g. v3.1.10).
# Manual inputs:
#   upload_to_s3            — push installers to S3 (default: true)
#   create_github_release — create GitHub Release from changelog.md (default: false)
# Tag pushes always upload to S3 and create a GitHub Release.
#
# Before shipping: bump version, add ## vX.Y.Z to changelog.md, commit to main.
#
# ── GitHub secrets (same AWS names as redd-api) ──
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION                  eu-north-1
#   S3_ASSETS_BUCKET            redd-website-assets
#
# ── macOS signing ──
#   APPLE_CERTIFICATE_BASE64       Developer ID Application .p12 (base64)
#   APPLE_CERTIFICATE_PASSWORD
#   KEYCHAIN_PASSWORD
#   APPLE_DEVELOPER_INSTALLER_IDENTITY
#                                  "Developer ID Installer: Reduce Digital Distraction Ltd (JD647S9RT6)"
#   APPLE_INSTALLER_CERTIFICATE_BASE64   (if Installer was exported as a separate .p12)
#   APPLE_INSTALLER_CERTIFICATE_PASSWORD (optional; defaults to APPLE_CERTIFICATE_PASSWORD)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#
# ── Windows signing (same as local .env) ──
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID

name: Release build

on:
  workflow_dispatch:
    inputs:
      upload_to_s3:
        description: Upload installers to S3 after a successful build
        type: boolean
        default: true
      create_github_release:
        description: Create a GitHub Release (notes from changelog.md)
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_ASSETS_BUCKET: ${{ secrets.S3_ASSETS_BUCKET }}
  S3_RELEASE_PREFIX: reddblock/

jobs:
  build-mac:
    name: macOS (.pkg)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Safari bridge dylib
        run: bash ./scripts/build-safari-bridge.sh

      - name: Import Apple signing certificates
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_INSTALLER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_INSTALLER_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash ./scripts/import-apple-certs-for-ci.sh

      - name: Build signed .app + .pkg
        env:
          APPLE_DEVELOPER_INSTALLER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_NOTARIZE_USER: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZE_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "Installer identities before build:"
          security find-identity -v "$KEYCHAIN_PATH" | grep "Developer ID Installer" || true
          npm run build:mac-all

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: for-distribution/reddblock-*.pkg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install trusted-signing-cli
        shell: pwsh
        run: |
          $bin = Join-Path $env:USERPROFILE '.cargo\bin\trusted-signing-cli.exe'
          if (-not (Test-Path $bin)) {
            cargo install trusted-signing-cli --locked
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.cargo\bin')

      - name: Locate SignTool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw 'SignTool.exe not found on runner — Windows SDK may be missing.'
          }
          "TAURI_WINDOWS_SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV
          Write-Host "SignTool: $($signtool.FullName)"

      - name: Build signed installers
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            for-distribution/redd-block_*-setup.exe
            for-distribution/redd-block_*.msi
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish (S3 / GitHub Release)
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: >-
      needs.build-mac.result == 'success' &&
      needs.build-windows.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.upload_to_s3 || inputs.create_github_release)
        )
      )
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: artifacts

      - name: Stage installers for publish
        run: |
          mkdir -p for-distribution
          find artifacts -type f -name 'reddblock-*.pkg' -exec cp {} for-distribution/ \;
          find artifacts -type f -name 'redd-block_*-setup.exe' -exec cp {} for-distribution/ \;
          echo "Staged installers:"
          ls -la for-distribution/

      - name: Resolve version and tag
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match package.json version v${VERSION}" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_to_s3)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload installers to S3
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_to_s3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: bash ./scripts/upload-release-to-s3.sh all

      - name: Extract release notes from changelog
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
        run: |
          bash ./scripts/extract-changelog-section.sh "${{ steps.meta.outputs.version }}" > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Fristed ${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          files: |
            for-distribution/reddblock-*.pkg
            for-distribution/redd-block_*-setup.exe
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
