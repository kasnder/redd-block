[package]
name = "redd-block"
version = "0.5.6"
description = "ReDD Block - block distracting websites and apps to stay focused"
authors = ["The Reduce Digital Distraction Project <team@reddfocus.org>"]
license = "CC-BY-NC-ND-3.0"
repository = "https://github.com/ulyngs/redd-block"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "redd_block_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
desktop = ["tauri/tray-icon"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dirs = "5"
lazy_static = "1.5"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-screentime = { path = "../tauri-plugin-screentime" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry"] }
