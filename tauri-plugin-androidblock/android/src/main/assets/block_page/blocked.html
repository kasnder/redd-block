<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked by ReDD Block</title>
    <style>
      :root {
        --bg: #faf8f5;
        --card-bg: #ffffff;
        --card-border: #e1dcd6;
        --text-primary: #1e2d3e;
        --text-secondary: #2c2c35;
        --text-muted: #696977;
        --divider: #e1dcd6;
        --accent: #2a9d8f;
        --button-text: #ffffff;
        --hero-ring: #e1dcd6;
        --badge-bg: #2a9d8f;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14202c;
          --card-bg: #1e2d3e;
          --card-border: rgba(255, 255, 255, 0.10);
          --text-primary: #f5f0e8;
          --text-secondary: #e6e2d8;
          --text-muted: #9aa3b0;
          --divider: rgba(255, 255, 255, 0.10);
          --accent: #4ec0b0;
          --button-text: #ffffff;
          --hero-ring: rgba(255, 255, 255, 0.20);
          --badge-bg: #4ec0b0;
        }
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        min-height: 100dvh;
      }

      body {
        background: var(--bg);
        color: var(--text-primary);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card {
        width: 100%;
        max-width: 520px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 28px;
        text-align: center;
      }

      .hero-wrap {
        position: relative;
        width: 88px;
        height: 88px;
        margin: 0 auto 16px;
      }

      .hero-ring {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: var(--hero-ring);
        overflow: hidden;
      }

      .hero-ring img,
      .hero-ring .hero-fallback {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 64px;
        height: 64px;
        object-fit: contain;
      }

      /* Hide the globe fallback whenever the browser icon is shown (WebView can
         ignore [hidden] on SVG, so this sibling rule is the reliable guard). */
      .hero-ring img:not([hidden]) ~ .hero-fallback {
        display: none !important;
      }

      .hero-badge {
        position: absolute;
        top: 0;
        left: 0;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--badge-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
      }

      .hero-badge svg {
        width: 100%;
        height: 100%;
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 500;
        margin: 0;
        line-height: 1.2;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--text-secondary);
        font-size: 15px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--pill-bg, var(--accent));
        color: var(--pill-text, var(--button-text));
        font-size: 15px;
        font-weight: 700;
        max-width: 100%;
      }

      .pill .emoji { font-size: 18px; }
      .pill .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .details {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--divider);
        text-align: left;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        font-size: 14px;
      }

      .detail-row:last-child { margin-bottom: 0; }

      .label { color: var(--text-muted); flex-shrink: 0; }
      .value {
        color: var(--text-primary);
        font-weight: 700;
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .value.multi {
        white-space: normal;
        max-width: 65%;
      }

      #countdown { font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="hero-wrap">
        <div class="hero-ring" aria-hidden="true">
          <img id="hero-icon" alt="" hidden />
          <svg id="hero-fallback" class="hero-fallback" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="var(--text-muted)" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.22.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
        </div>
        <div class="hero-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#ffffff" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM4 12c0-4.42 3.58-8 8-8 1.85 0 3.55.63 4.9 1.69L5.69 16.9C4.63 15.55 4 13.85 4 12zm8 8c-1.85 0-3.55-.63-4.9-1.69L18.31 7.1C19.37 8.45 20 10.15 20 12c0 4.42-3.58 8-8 8z"/>
          </svg>
        </div>
      </div>

      <h1>Blocked by ReDD&nbsp;Block</h1>
      <p class="subtitle" id="subtitle"></p>

      <div class="pill" id="pill" hidden>
        <span class="emoji" id="pill-emoji"></span>
        <span class="name" id="pill-name"></span>
      </div>

      <div class="details">
        <div class="detail-row">
          <span class="label">Site</span>
          <span class="value multi" id="site-value"></span>
        </div>
        <div class="detail-row">
          <span class="label">Blocklist</span>
          <span class="value" id="blocklist-value"></span>
        </div>
        <div class="detail-row" id="row-ends" hidden>
          <span class="label" id="ends-label">Ends in</span>
          <span class="value"><span id="countdown"></span><span id="ends-at-suffix"></span></span>
        </div>
        <div class="detail-row" id="row-started" hidden>
          <span class="label">Started at</span>
          <span class="value" id="started-value"></span>
        </div>
      </div>
    </div>
    <script src="/blocked.js"></script>
  </body>
</html>
